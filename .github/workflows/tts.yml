# Vaqtinchalik: investor videosi ovozi. Video tayyor bo'lgach o'chiriladi.
name: Video TTS

on:
  push:
    paths:
      - video/tts/**
      - .github/workflows/tts.yml

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: python video/tts/make.py out
      - name: tts-audio branchiga yozish
        run: |
          cd out
          echo "${{ github.sha }}" > SHA.txt
          git init -q -b tts-audio
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "TTS ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tts-audio
