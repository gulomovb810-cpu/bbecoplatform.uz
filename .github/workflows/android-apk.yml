# Android ilova (APK): index.html o'zgarganda avtomatik yig'iladi.
# Tayyor fayl "apk" branchiga yoziladi:
#   https://github.com/<owner>/<repo>/raw/apk/bbeco.apk
# Play Market uchun o'z kalitingizni GitHub secrets'ga qo'shing:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Qo'shilmasa, repodagi umumiy sinov kaliti (android/debug.keystore) ishlatiladi.
name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - index.html
      - config.js
      - android/**
      - .github/workflows/android-apk.yml

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Imzo kaliti (agar secrets'da bo'lsa)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: APK yig'ish
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Faylni tayyorlash
        run: cp android/app/build/outputs/apk/release/app-release.apk bbeco.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bbeco-apk
          path: bbeco.apk

      - name: apk branchiga yozish
        run: |
          mkdir out && cp bbeco.apk out/ && cd out
          echo "Versiya: 1.0.${{ github.run_number }} (${{ github.sha }})" > VERSION.txt
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bbeco.apk VERSION.txt
          git commit -q -m "APK 1.0.${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
