plugins {
    id 'com.android.application'
}

// Ilova sahifalari repo ildizidagi index.html va config.js'dan olinadi
def syncWeb = tasks.register('syncWeb', Copy) {
    from(rootProject.file('../index.html'))
    from(rootProject.file('../config.js'))
    into(layout.projectDirectory.dir('src/main/assets/www'))
}
preBuild.dependsOn(syncWeb)

android {
    namespace 'uz.bbecoplatform.app'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.bbecoplatform.app'
        minSdk 24
        targetSdk 34
        def vc = System.getenv('VERSION_CODE') ?: '1'
        versionCode Integer.parseInt(vc)
        versionName "1.0.${vc}"
    }

    signingConfigs {
        release {
            // GitHub secrets'da o'z kalitingiz bo'lsa, o'shani ishlatadi (Play Market uchun shart).
            // Bo'lmasa, repodagi umumiy sinov kaliti ishlatiladi: shunda yangi versiyalar
            // eskisining ustiga o'rnatiladi, lekin Play Market'ga yuklab bo'lmaydi.
            def ks = System.getenv('ANDROID_KEYSTORE_PATH')
            storeFile ks ? file(ks) : rootProject.file('debug.keystore')
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: 'android'
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'androiddebugkey'
            keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
